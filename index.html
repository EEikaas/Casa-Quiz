<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sotbyen</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6dcc3; --surface:#f3ebd6; --raise:#fbf5e4; --ink:#2a2226; --muted:#6b5f5a; --line:#bfae8a;
  --brass:#8a6417; --brass-ink:#fff8e6; --brick:#8a3b2e; --teal:#2f5d62; --map:#ddd0b0; --route:#a8997a;
  --ok:#2e7d4f; --bad:#a23a2c;
  --display:"Alfa Slab One",Rockwell,"Roboto Slab",Georgia,serif;
  --body:Spectral,Georgia,"Times New Roman",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#211b1e; --surface:#2c2428; --raise:#382e33; --ink:#efe3c2; --muted:#a8998c; --line:#4a3d42;
    --brass:#c9a24a; --brass-ink:#211b1e; --brick:#c0604f; --teal:#5fa3a8; --map:#2a2327; --route:#5b4d50;
    --ok:#6fbf8a; --bad:#e07a66;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#211b1e; --surface:#2c2428; --raise:#382e33; --ink:#efe3c2; --muted:#a8998c; --line:#4a3d42;
  --brass:#c9a24a; --brass-ink:#211b1e; --brick:#c0604f; --teal:#5fa3a8; --map:#2a2327; --route:#5b4d50;
  --ok:#6fbf8a; --bad:#e07a66;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
#app{max-width:1180px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0 0 .4em}
h1{font-size:clamp(2.6rem,11vw,5rem);letter-spacing:.01em}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn{display:inline-block;border:0;border-radius:4px;background:var(--brass);color:var(--brass-ink);padding:.7em 1.1em;font-family:var(--display);font-size:1rem;min-height:48px}
.btn.wide{display:block;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-family:var(--body);font-weight:600}
.btn.brick{background:var(--brick);color:#fff8e6}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
input[type=text],select{background:var(--raise);border:2px solid var(--line);border-radius:4px;padding:.55em .7em;min-height:48px;min-width:0}
input[type=text]{flex:1}

/* forside */
.home{max-width:560px;margin:0 auto;padding-top:4vh}
.home h1{margin-bottom:.1em}
.smoke{font-style:italic;font-size:1.15rem;margin-bottom:1.4em}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--brass);border-radius:4px;padding:14px 16px;min-height:48px}
.choice b{font-family:var(--display);font-weight:400;font-size:1.15rem;display:block}
.choice span{color:var(--muted);font-size:.95rem}
.choice:disabled{opacity:.5}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:22px}
summary{font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center}
ol{padding-left:1.3em;margin:.4em 0}
li{margin-bottom:.5em}

/* lobby */
.code{font-family:var(--display);font-size:clamp(2.6rem,12vw,4.5rem);letter-spacing:.12em;line-height:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:transparent;border-radius:4px;padding:.5em .8em;min-height:44px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{margin-bottom:14px}
.field>label,.field>.lab{display:block;font-weight:600;margin-bottom:4px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.x{border:0;background:transparent;font-size:1.3rem;min-width:44px;min-height:44px;color:var(--muted)}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:baseline;border:1px solid var(--ink)}

/* spill */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.top .brand{font-family:var(--display);font-size:1.2rem}
.scores{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.sc{flex:0 0 auto;border:1px solid var(--line);border-radius:4px;padding:4px 9px;background:var(--surface);font-size:.9rem;white-space:nowrap}
.sc.on{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--brass)}
.game{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.game.act .mapwrap{order:-1}
@media (min-width:900px){
  .game{grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);align-items:start}
  .game .mapwrap{order:-1}
  body{font-size:19px}
}
.mapwrap{background:var(--map);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mapsvg{display:block;width:100%;height:auto}
.canal{fill:none;stroke:var(--teal);stroke-width:26;opacity:.28;stroke-linecap:round}
.nd{fill:var(--raise);stroke:var(--ink);stroke-width:3}
.nd.goal{stroke:var(--brass);stroke-width:7}
.nl{font-family:var(--body);font-weight:600;font-size:23px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--map);stroke-width:7px;stroke-linejoin:round}
.seg0{stroke:var(--route);stroke-width:11}
.segb{stroke:var(--ink);stroke-width:17}
.segc{stroke-width:11}
.hit{stroke:transparent;stroke-width:46;cursor:pointer}
.rt.sel .seg0{stroke:var(--ink);stroke-width:15}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.msg{font-style:italic;color:var(--muted);margin-bottom:8px;font-size:.95rem}
.slip{background:var(--raise);border:1px solid var(--line);border-top:6px double var(--ink);padding:14px;border-radius:2px}
.slip .cat{font-family:var(--display);font-size:.95rem;color:var(--brick)}
.slip .qt{font-size:1.3rem;font-weight:600;line-height:1.3;margin:.3em 0 .7em}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:.65em .8em;min-height:52px;margin-top:8px;font-size:1.05rem}
.opt i{font-family:var(--display);font-style:normal;width:1.4em;flex:0 0 auto}
.opt.right{border-color:var(--ok);box-shadow:inset 6px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 6px 0 0 var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
.fuse{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 2px}
.fuse i{display:block;height:100%;background:var(--brick);width:100%;transform-origin:left;animation:fuse linear forwards}
@keyframes fuse{to{transform:scaleX(0)}}
.cats{display:grid;gap:8px}
.catb{text-align:left;background:var(--raise);border:2px solid var(--line);border-radius:4px;padding:.7em .9em;min-height:52px;font-family:var(--display);font-size:1.1rem}
.catb[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 8px 0 0 var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:52px}
.chip{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:var(--brass);color:var(--brass-ink);border:3px solid var(--ink)}
.chip.pol{background:var(--brick);color:#fff8e6;font-size:.7rem}
.pad{display:grid;place-items:center;width:100%;min-height:220px;border-radius:8px;border:4px solid var(--ink);background:var(--raise);font-family:var(--display);font-size:2rem;user-select:none;-webkit-user-select:none}
.pad.go{background:var(--brass);color:var(--brass-ink)}
.digits{font-family:var(--display);font-size:3rem;letter-spacing:.2em;text-align:center;min-height:1.3em}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:10px auto 0}
.keys button{min-height:56px;font-family:var(--display);font-size:1.3rem;background:var(--raise);border:2px solid var(--line);border-radius:4px}
.qr{width:170px;max-width:45vw;background:#fff;padding:6px;border-radius:4px;flex:0 0 auto}.qr svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:6px 4px;border-bottom:1px dashed var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;font-size:.85rem}
.tw{overflow-x:auto}
.win{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.6rem);margin:.4em 0}
.opt.mytip{border-color:var(--teal);box-shadow:inset 6px 0 0 var(--teal)}
.tipnote{margin-top:10px;padding:8px 10px;border-left:4px solid var(--teal);background:var(--raise);font-size:.95rem}
body.big{font-size:22px}
body.big #app{max-width:none;padding:20px 32px 32px}
body.big h2{font-size:2rem}
body.big .top .brand{font-size:1.8rem}
body.big .sc{font-size:1.15rem;padding:8px 14px}
body.big .slip .qt{font-size:2.2rem}
body.big .slip .cat{font-size:1.2rem}
body.big .opt{font-size:1.45rem;min-height:66px}
body.big .qr{width:280px;max-width:30vw}
body.big .joincode{font-family:var(--display);font-size:1.6rem;letter-spacing:.08em}
@media (min-width:900px){body.big .game{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.banner{background:var(--brick);color:#fff8e6;padding:8px 12px;border-radius:4px;margin-bottom:10px}
.foot{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.fuse i{animation:none}}

.pt{display:inline-block;border-radius:50%;overflow:hidden;vertical-align:middle;flex:0 0 auto;border:2px solid var(--ink);background:var(--raise)}
.pt svg{display:block;width:100%;height:100%}
.who{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.who h2{margin:0}
.chars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 0}
.charb{border:2px solid var(--line);background:var(--raise);border-radius:6px;padding:5px 2px;font-size:.72rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;min-width:0}
.charb .pt{width:100%;max-width:58px;aspect-ratio:1/1;height:auto}
.charb[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 -5px 0 var(--brass)}
.charb:disabled{opacity:.3}
.ability{font-size:.92rem;color:var(--muted);min-height:1.4em}
.prog{display:flex;gap:6px;margin:4px 0 8px;align-items:center}
.prog i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:block}
.prog i.ok{background:var(--ok);border-color:var(--ok)}
.prog i.no{background:var(--bad);border-color:var(--bad)}
.vs{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:8px 0;text-align:center}
.vs b{display:block}
.req{font-size:.88rem;color:var(--muted)}
.req b{color:var(--ink)}
.shady{margin-top:12px}
.shady .row{margin-bottom:6px}
.res{font-family:var(--display);font-size:1.25rem;margin:.3em 0}
.opt.gone{visibility:hidden}
.mini{max-width:420px}
body.big .who .pt{width:110px!important;height:110px!important}
body.big .vs .pt{width:110px!important;height:110px!important}
body.big .res{font-size:1.8rem}
</style>
</head>

  const seen={[a]:1},st=[a];while(st.length){const x=st.pop();if(x===b)return true;(adj[x]||[]).forEach(y=>{if(!seen[y]){seen[y]=1;st.push(y)}})}return false}

  award('net','Byens lengste nett',5);award('right','Kvikkeste hode',3);award('bag','Smuglerkongen',3);award('mg','Minispillmester',3);award('tips','Beste tippere',3);award('heist','Mesterbanditten',3);
  res.forEach(r=>r.tot=r.rp+r.mp+r.cp+r.bp);res.sort((a,b)=>b.tot-a.tot);return res;

  mission(p,cid){const t=S.turn;if(S.phase!=='act'||!owns(cid,t.pid)||t.gotM)return;const tm=turnTeam(),c=ab(t.pid,'avis')?1:2;if(tm.coins<c||tm.missions.length>=4)return;
    const m=newMission(tm);if(!m)return;tm.coins-=c;tm.missions.push(m);t.gotM=1;S.msg=tm.name+' tok et nytt oppdrag.'},
  bagOpen(p,cid){const t=S.turn;if(S.phase!=='act'||!owns(cid,t.pid)||t.ok<3||t.bag.pool)return;const tm=turnTeam();
    const pool=[1,1,1,1,2,2,2,4,0,0,0,0];tm.routes.forEach(()=>pool.push(2));t.bag={pool:shuffle(pool),drawn:[],bust:0,done:0,lim:S.cfg.level==='easy'?3:2}},
  bagDraw(p,cid){const t=S.turn,b=t.bag;if(S.phase!=='act'||!owns(cid,t.pid)||!b.pool||b.done||!b.pool.length)return;
    b.drawn.push(b.pool.pop());if(b.drawn.filter(x=>x===0).length>=b.lim){b.bust=1;b.done=1;S.msg='Razzia! Politiet tok hele lasten.'}
    else if(!b.pool.length)H.bagStop(p,cid)},
  bagStop(p,cid){const t=S.turn,b=t.bag;if(S.phase!=='act'||!owns(cid,t.pid)||!b.pool||b.done)return;const sum=b.drawn.reduce((s,x)=>s+x,0);
    const tm=turnTeam();tm.coins+=sum;tm.bag+=sum;b.done=1;S.msg=tm.name+' smuglet varer for '+sum+' kr.'},
  rob(p,cid){const t=S.turn;if(S.phase!=='act'||!owns(cid,t.pid)||t.shady)return;const tm=turnTeam(),vt=T(+p.tid);if(!vt||vt===tm||vt.coins<1)return;
    t.shady=1;const ok=Math.random()<0.5;
    if(ok){const amt=Math.min(3,vt.coins);vt.coins-=amt;tm.coins+=amt;tm.heist=(tm.heist||0)+1;t.rob={tid:vt.id,ok:1,amt};S.msg='Ranet lyktes! '+tm.name+' stakk av med '+amt+' kr fra '+vt.name+'.'}
    else{const amt=Math.min(ab(t.pid,'smugler')?1:2,tm.coins);tm.coins-=amt;vt.coins+=amt;t.rob={tid:vt.id,ok:0,amt};S.msg='Tatt på fersk gjerning! '+tm.name+' betaler '+amt+' kr i bot til '+vt.name+'.'}},
  duel(p,cid){const t=S.turn;if(S.phase!=='act'||!owns(cid,t.pid)||t.shady)return;const tm=turnTeam(),vt=T(+p.tid);if(!vt||vt===tm)return;
    const stake=Math.min(3,tm.coins,vt.coins);if(stake<1)return;t.shady=1;
    S.duel={kind:'coins',a:t.pid,d:defender(vt.id),ta:tm.id,td:vt.id,stake,e:-1,q:pickQ(rnd(6)),ans:{},win:null};S.phase='duel';S.pn++;S.msg=''},
  challenge(p,cid){const t=S.turn;if(S.phase!=='act'||!owns(cid,t.pid)||t.shady||t.bought)return;const e=+p.e;if(!(e>=0&&e<EDGES.length))return;
    const tm=turnTeam(),ow=S.own[e];if(!ow||ow===tm.id)return;if(PAIR[e]>=0&&S.own[PAIR[e]]===tm.id)return;

    S.duel={kind:'route',a:t.pid,d:defender(vt.id),ta:tm.id,td:vt.id,stake:0,fee,e,q:pickQ(rnd(6)),ans:{},win:null};S.phase='duel';S.pn++;S.msg=''},
  duelAns(p,cid){const d=S.duel;if(S.phase!=='duel')return;const pid=p.pid,i=+p.i;if((pid!==d.a&&pid!==d.d)||!owns(cid,pid)||d.ans[pid]!=null||!(i>=0&&i<4))return;
    d.ans[pid]=i;if(d.ans[d.a]!=null&&d.ans[d.d]!=null)resolveDuel()},
  duelNext(p,cid){if(S.phase!=='duelres'||!owns(cid,S.turn.pid))return;S.phase='act';S.pn++},
  endTurn(p,cid){const t=S.turn;if(S.phase!=='act'||!owns(cid,t.pid))return;if(t.bag.pool&&!t.bag.done)return;
    S.msg='';S.ti++;if(S.ti<S.order.length){startTurn();return}
    S.ti=0;if(S.round>=S.rounds){S.phase='final';S.fin=0;S.pn++;return}
    if(S.round%S.mgEvery===0){startMg();return}
    S.round++;startTurn()},
  mgScore(p,cid){const g=S.mg;if(S.phase!=='mg'||!owns(cid,p.pid)||g.sc[p.pid]!=null)return;let v=+p.v;if(!(v>=0))v=0;g.sc[p.pid]=Math.min(v,9999);

  mgSkip(p,cid){if(S.phase!=='mg'||cid!==S.host)return;mgFinish()},
  mgNext(p,cid){if(S.phase!=='mgres')return;S.round++;startTurn()},
  finNext(p,cid){if(S.phase!=='final'||S.fin>=4)return;S.fin++},
  again(p,cid){if(S.phase!=='final'||cid!==S.host)return;S.phase='lobby';S.teams=[];S.turn={};S.duel={};S.mg={};S.msg='';S.pn++},
  takeover(p,cid){if(cid!==S.host)return;const ids=S.phase==='duel'?[S.duel.a,S.duel.d]:[S.turn.pid];ids.forEach(id=>{const pl=PL(id);if(pl)pl.owner=S.host})}
};
function apply(a,cid){try{if(!S)return;setMap(S.cfg.map);const h=H[a&&a.t];if(h)h(a.p||{},cid)}catch(e){console.error(e)}}

/* ---------- lagring og nett (PeerJS, direkte mellom enheter) ---------- */
const NET_OK=()=>typeof window.Peer!=='undefined';
const PID=c=>'sotbyen-v1-'+c.toLowerCase();
let peer=null,conns=[],hostConn=null,retryT=null,mySeq=0,outbox=[];
function commit(){S.rev++;persist();onState()}
function persist(){
  LS.set('sot.used',S.used);
  if(role==='local')LS.set('sot.local',S);
  if(role==='host'){LS.set('sot.host',S);broadcast()}
}
function broadcast(){const m={k:'state',s:S};conns.forEach(c=>{if(c.open){try{c.send(m)}catch(e){}}})}
function netErr(msg){ui.net=msg;render()}
function stopNet(){clearTimeout(timer);clearTimeout(retryT);conns=[];hostConn=null;outbox=[];if(peer){const p=peer;peer=null;try{p.destroy()}catch(e){}}}
function take(cid,x){let ch=false;if(!x||!Array.isArray(x.list))return false;
  x.list.slice().sort((a,b)=>a.seq-b.seq).forEach(a=>{if(!a||a.gid!==S.gid||typeof a.seq!=='number')return;if(a.seq<=(S.seq[cid]||0))return;S.seq[cid]=a.seq;apply(a,cid);ch=true});return ch}
function hostOpen(code,resume){
  stopNet();if(!NET_OK()){ui.err='Klarte ikke å laste nettverksdelen. Sjekk nettet og last siden på nytt.';S=null;role=null;render();return}
  ui.busy=resume?'Gjenoppretter spillet …':'Oppretter spill …';render();
  const p=new window.Peer(PID(code));peer=p;
  p.on('open',()=>{if(peer!==p)return;ui.busy='';ui.net='';if(!resume)S=newState('net',code);S.host=CID;role='host';ui.timerPn=-1;LS.set('sot.net',{code,role:'host'});persist();onState()});
  p.on('connection',c=>{
    c.on('open',()=>{conns.push(c);try{c.send({k:'state',s:S})}catch(e){}});
    c.on('data',d=>{if(!S||peer!==p||!d)return;
      if(d.k==='act'&&typeof d.cid==='string'){if(take(d.cid,{list:[d.a]}))commit()}
      else if(d.k==='hello'){try{c.send({k:'state',s:S})}catch(e){}}});
    c.on('close',()=>{conns=conns.filter(x=>x!==c)});
    c.on('error',()=>{});
  });
  p.on('error',e=>{if(peer!==p)return;const t=e&&e.type;
    if(t==='unavailable-id'){if(resume){ui.busy='Venter på at den gamle forbindelsen slippes …';render();retryT=setTimeout(()=>hostOpen(code,true),4000)}else hostCreate();return}
    if(t==='browser-incompatible'){stopNet();ui.busy='';ui.err='Denne nettleseren støtter ikke spill mellom enheter.';S=null;role=null;render();return}
    if(!S){stopNet();ui.busy='';ui.err='Fikk ikke kontakt med koblingsserveren. Sjekk nettet og prøv igjen.';render();return}
    netErr('Mistet kontakten med koblingsserveren. Prøver igjen …');retryT=setTimeout(()=>{if(peer===p&&!p.destroyed){try{p.reconnect()}catch(_){}}},3000)});
  p.on('disconnected',()=>{if(peer===p&&!p.destroyed)retryT=setTimeout(()=>{if(peer===p){try{p.reconnect()}catch(_){}}},2000)});
}
function hostCreate(){const ab='ABCDEFGHJKLMNPRSTUVWXYZ';let code='';for(let i=0;i<4;i++)code+=pick(ab);ui.err='';S=null;hostOpen(code,false)}
function recv(d){if(!d||role!=='guest')return;if(S&&d.gid===S.gid&&d.rev<S.rev)return;S=d;ui.pending=false;ui.net='';onState()}
function joinGame(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z]/g,'');if(code.length!==4){ui.err='Koden har fire bokstaver.';render();return}
  if(!NET_OK()){ui.err='Klarte ikke å laste nettverksdelen. Sjekk nettet og last siden på nytt.';render();return}
  stopNet();ui.busy='Kobler til spill '+code+' …';ui.err='';render();
  const p=new window.Peer();peer=p;let got=false;
  const fail=msg=>{if(peer!==p)return;clearTimeout(to);stopNet();ui.busy='';S=null;role=null;ui.err=msg;render()};
  const to=setTimeout(()=>{if(!got)fail('Fikk ikke kontakt med spill '+code+'. Sjekk koden, og at vertsskjermen er åpen.')},15000);
  const connect=()=>{if(peer!==p)return;const c=p.connect(PID(code),{reliable:true});hostConn=c;
    c.on('open',()=>{if(hostConn!==c)return;ui.net='';try{c.send({k:'hello',cid:CID})}catch(e){}const now=Date.now();outbox.filter(a=>now-a.seq<8000).forEach(a=>{try{c.send({k:'act',cid:CID,a})}catch(e){}})});
    c.on('data',d=>{if(hostConn!==c||!d||d.k!=='state'||!d.s)return;
      if(!got){got=true;clearTimeout(to);ui.busy='';role='guest';S=null;LS.set('sot.net',{code,role:'guest'})}recv(d.s)});
    c.on('close',()=>{if(hostConn!==c||!got||peer!==p)return;netErr('Mistet kontakten med verten. Kobler til igjen …');clearTimeout(retryT);retryT=setTimeout(connect,2500)});
    c.on('error',()=>{});
  };
  p.on('open',connect);
  p.on('error',e=>{if(peer!==p)return;const t=e&&e.type;
    if(t==='peer-unavailable'){if(got){netErr('Verten er ikke tilgjengelig akkurat nå. Prøver igjen …');clearTimeout(retryT);retryT=setTimeout(connect,4000)}else{LS.del('sot.net');fail('Fant ikke noe åpent spill med koden '+code+'.')}return}
    if(t==='browser-incompatible'){fail('Denne nettleseren støtter ikke spill mellom enheter.');return}
    if(got)netErr('Nettverksfeil. Prøver igjen …')});
  p.on('disconnected',()=>{if(peer===p&&!p.destroyed)setTimeout(()=>{if(peer===p){try{p.reconnect()}catch(_){}}},2000)});
}
function sendAct(t,p){mySeq=Math.max(mySeq+1,Date.now());const a={seq:mySeq,t,p:p||{},gid:S.gid};outbox.push(a);outbox=outbox.slice(-6);
  if(hostConn&&hostConn.open){try{hostConn.send({k:'act',cid:CID,a})}catch(e){}}}

let pendTok=0;
function act(t,p){
  if(!S)return;
  if(role==='guest'){sendAct(t,p);ui.pending=true;const k=++pendTok;setTimeout(()=>{if(k===pendTok&&ui.pending){ui.pending=false;render()}},4000);render()}
  else{apply({t,p:p||{}},CID);commit()}
}
const qDur=()=>{const b=S.cfg.level==='easy'?40:30;if(S.phase==='duel'){const d=S.duel;return (PL(d.a)&&PL(d.d)&&PL(d.a).owner===PL(d.d).owner)?b*2:b}return b};
function onState(){
  setMap(S.cfg.map);
  if(S.pn!==ui.pn){ui.pn=S.pn;ui.pnAt=Date.now();ui.cat=null;ui.sel=null;ui.menu=false;ui.shady=false;if(role==='local')ui.showM=false;if(S.phase!=='mg')ui.mg=null}
  if(isHost()&&(S.phase==='q'||S.phase==='duel')&&ui.timerPn!==S.pn){ui.timerPn=S.pn;clearTimeout(timer);const pn=S.pn;
    timer=setTimeout(()=>{if(S&&S.pn===pn&&isHost()){apply({t:'timeout',p:{pn}},CID);commit()}},qDur()*1000+(role==='host'?1500:0))}
  render();
}

  const mt=missionTeam(),big=ui.big&&role==='host';
  let s=banner()+'<div class="top"><span class="brand">'+MAPINFO[MAPID].name+'</span><span class="small muted">'+(ph==='final'?'Slutt':'Runde '+S.round+' av '+S.rounds)+(S.mode==='net'&&!big?', kode '+esc(S.code):'')+'</span>'+(big?'<span class="joincode">Kode '+esc(S.code)+'</span>':'')+'</div>';
  s+='<div class="scores">'+S.teams.map(x=>{const solo=!S.cfg.teams?members(x.id)[0]:null;return '<div class="sc'+(x.id===activeTeam&&!['final','mg','mgres'].includes(ph)?' on':'')+'">'+(solo?portrait(solo.ch,22):'<span class="dot" style="background:'+x.color+'"></span>')+' <span class="dot" style="background:'+x.color+'"></span> '+tname(x)+' <b>'+x.coins+' kr</b> <span class="muted">'+routePts(x)+' p</span></div>'}).join('')+'</div>';
  s+='<div class="game'+(ph==='act'?' act':'')+'"><div class="panel">';
  if(S.msg)s+='<div class="msg" role="status">'+esc(S.msg)+'</div>';
  s+=ph==='cat'?catHTML():(ph==='q'||ph==='qres')?qHTML():ph==='act'?actHTML():ph==='duel'?duelHTML():ph==='duelres'?duelresHTML():ph==='mg'?mgHTML():ph==='mgres'?mgresHTML():finalHTML();
  if(mt&&ph!=='final'&&ph!=='mg'){s+='<div class="foot"><button class="btn ghost" data-a="showM">'+(ui.showM?'Skjul oppdrag':'Vis hemmelige oppdrag')+'</button></div>';if(ui.showM)s+=missionsHTML(mt)}
  s+='</div><div class="mapwrap">'+mapSVG(mt)+'</div></div>';
  s+='<div class="foot"><button class="btn ghost" data-a="menu">Meny</button>'+(big?'<button class="btn ghost" data-a="fs">Fullskjerm</button>':'');
  if(ui.menu){
    if(role==='host'&&['cat','q','qres','act','duel','duelres'].includes(ph))s+='<button class="btn ghost" data-a="takeover">Styr denne turen herfra</button>';
    s+='<button class="btn ghost" data-a="quit">'+(role==='guest'?'Forlat spillet':'Avslutt spillet')+'</button>';
  }
  return s+'</div>';
}

/* ---------- hendelser ---------- */
let wl=null,wlBusy=false;
async function keepAwake(){if(!S||S.mode!=='net'||wl||wlBusy||!navigator.wakeLock||document.visibilityState!=='visible')return;wlBusy=true;
  try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){}wlBusy=false}
document.addEventListener('visibilitychange',keepAwake);
const UIA={
  newLocal(){stopNet();ui.big=false;S=newState('local');role='local';ui.err='';onState()},
  newHost(){if(NET_OK()){ui.err='';ui.big=false;LS.set('sot.big',false);hostCreate()}},
  newBig(){if(NET_OK()){ui.err='';ui.big=true;LS.set('sot.big',true);hostCreate()}},
  fs(){const el=document.documentElement;try{if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{})}catch(e){}},
  join(){const el=$('#code');joinGame(el?el.value:ui.codeDraft)},
  resumeLocal(){const sl=LS.get('sot.local');if(sl&&sl.v===VERSION){S=sl;S.host=CID;S.players.forEach(p=>p.owner=CID);role='local';ui.timerPn=-1;onState()}},
  resumeNet(){const sn=LS.get('sot.net');if(!sn)return;const sh=LS.get('sot.host');if(sn.role==='host'&&sh&&sh.code===sn.code&&sh.v===VERSION){S=sh;role='host';ui.big=!!LS.get('sot.big');hostOpen(sn.code,true)}else joinGame(sn.code)},
  quit(){if(role==='local'&&S.phase==='lobby')LS.del('sot.local');if(role!=='local')LS.del('sot.net');if(role==='host')LS.del('sot.host');stopNet();S=null;role=null;ui.big=false;ui.menu=false;ui.net='';ui.err='';ui.pn=-1;render()},
  cfg(d){act('cfg',{k:d('k'),v:d('v')})},
  pickChar(d){ui.char=+d('c');render()},
  setChar(d){act('setChar',{id:ui.chFor,ch:+d('c')})},
  chFor(d){ui.chFor=d('id');render()},
  chDone(){ui.chFor=null;render()},
  addP(){const el=$('#pname');const name=(el?el.value:'').trim();if(!name)return;const free=freeChars(null);const ch=ui.char!=null&&free.includes(ui.char)?ui.char:free[0];ui.draft='';ui.char=null;if(el)el.value='';act('addP',{name,ch})},
  delP(d){if(ui.chFor===d('id'))ui.chFor=null;act('delP',{id:d('id')})},
  start(){ui.chFor=null;act('start')},
  cat(d){act('pickCat',{cat:+d('c')})},
  ans(d){act('answer',{i:+d('i')})},
  tip(d){act('tip',{i:+d('i')})},
  half(){act('half')},swap(){act('swap')},
  next(){act('next')},
  sel(d){ui.sel=+d('e');render()},
  buy(){if(ui.sel!=null){const e=ui.sel;ui.sel=null;act('buy',{e})}},
  challenge(){if(ui.sel!=null){const e=ui.sel;ui.sel=null;act('challenge',{e})}},
  shadyMenu(){ui.shady=!ui.shady;render()},
  duel(d){ui.shady=false;act('duel',{tid:+d('t')})},
  rob(d){ui.shady=false;act('rob',{tid:+d('t')})},
  duelAns(d){act('duelAns',{pid:d('p'),i:+d('i')})},
  duelNext(){act('duelNext')},
  mission(){act('mission')},bagOpen(){act('bagOpen')},bagDraw(){act('bagDraw')},bagStop(){act('bagStop')},endTurn(){act('endTurn')},
  showM(){ui.showM=!ui.showM;render()},
  menu(){ui.menu=!ui.menu;render()},
  takeover(){ui.menu=false;act('takeover')},
  mgStart(){const m=ui.mg,g=S.mg;if(!m||m.st!=='ready')return;
    if(g.type==='react'){m.st='wait';render();setTimeout(()=>{if(ui.mg!==m||m.st!=='wait')return;m.st='go';m.t0=performance.now();render()},1500+rnd(2600))}
    else if(g.type==='taps'){m.st='run';m.n=0;render();setTimeout(()=>{if(ui.mg===m)mgSubmit(m.n)},5000)}
    else{m.st='show';render();setTimeout(()=>{if(ui.mg!==m)return;m.st='enter';render()},S.cfg.level==='easy'?4000:3000)}},
  mgSkip(){act('mgSkip')},mgNext(){act('mgNext')},finNext(){act('finNext')},again(){act('again')}
};
const PD={
  mgTap(){const m=ui.mg,g=S&&S.mg;if(!m||!g)return;
    if(g.type==='react'){if(m.st==='wait')mgSubmit(1500);else if(m.st==='go')mgSubmit(Math.min(1500,Math.round(performance.now()-m.t0)))}
    else if(g.type==='taps'&&m.st==='run'){m.n++;const el=$('#tapn');if(el)el.textContent=m.n}},
  mgKey(el){const m=ui.mg,g=S&&S.mg;if(!m||m.st!=='enter')return;const k=el.getAttribute('data-k');
    if(k==='x')m.entry=m.entry.slice(0,-1);else m.entry+=k;
    if(m.entry.length>=g.code.length){let v=0;for(let i=0;i<g.code.length;i++)if(m.entry[i]===g.code[i])v++;mgSubmit(v);return}
    const e=$('#entry');if(e)e.textContent=m.entry||'·'}
};
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(!el||el.disabled)return;const f=UIA[el.getAttribute('data-a')];if(f)f(n=>el.getAttribute('data-'+n),el)});
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('[data-pd]');if(!el)return;e.preventDefault();const f=PD[el.getAttribute('data-pd')];if(f)f(el)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='pname')ui.draft=el.value;if(el.id==='code')ui.codeDraft=el.value});
document.addEventListener('change',e=>{const el=e.target,k=el.getAttribute&&el.getAttribute('data-ch');if(!k||!S)return;
  if(k==='team')act('setTeam',{id:el.getAttribute('data-id'),team:+el.value});
  if(k==='rounds')act('cfg',{k:'rounds',v:+el.value})});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target&&e.target.id;if(id==='pname'){e.preventDefault();UIA.addP()}if(id==='code'){e.preventDefault();UIA.join()}});

/* ---------- oppstart ---------- */
(function(){const h=(location.hash||'').slice(1).toUpperCase();
  if(/^[A-Z]{4}$/.test(h)){ui.codeDraft=h;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(NET_OK()){joinGame(h);return}}
  render()})();
window.__sot={get S(){return S},ui,UIA,PD,H,act,finalScores,get EDGES(){return EDGES},get PAIR(){return PAIR}};
})();
</script>
</body>
