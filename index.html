<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c0b">
<title>Sotbyen</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0e0c0b; --surface:#171412; --raise:#221d19; --ink:#ece4d6; --muted:#a39684; --line:#3a312b;
  --brass:#c8873a; --brass2:#e2a85e; --brass-ink:#140f0b; --brick:#a32e26; --teal:#5f9ea0; --ok:#7dbb72; --bad:#e0604f;
  --display:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --flavor:"Playfair Display",Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background:radial-gradient(ellipse at 20% -10%,#2a211b 0%,transparent 55%),radial-gradient(ellipse at 110% 110%,#26180f 0%,transparent 50%),var(--bg)}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;opacity:.55;
  background:radial-gradient(closest-side,rgba(200,190,175,.07),transparent) 10% 20%/60% 40% no-repeat,radial-gradient(closest-side,rgba(200,190,175,.06),transparent) 80% 60%/70% 45% no-repeat,radial-gradient(closest-side,rgba(200,190,175,.05),transparent) 40% 90%/80% 40% no-repeat;
  animation:smoke 40s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes smoke{from{transform:translate3d(-3%,0,0) scale(1)}to{transform:translate3d(3%,-2%,0) scale(1.08)}}
#app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:14px 14px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.04em;line-height:1;margin:0 0 .35em}
h1{font-size:clamp(3.6rem,17vw,7rem);letter-spacing:.06em;background:linear-gradient(180deg,#f1d3a0,#c8873a 60%,#7c4d1f);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.9rem}
h3{font-size:1.3rem;color:var(--brass2)}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.flavor{font-family:var(--flavor);font-style:italic}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #e9b27255;border-radius:6px;
  background:linear-gradient(180deg,#dd9c50,#a8662a);color:var(--brass-ink);padding:.55em 1.1em;font-family:var(--display);font-size:1.25rem;letter-spacing:.07em;min-height:48px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 #4f2d10,0 6px 18px rgba(0,0,0,.4);text-transform:uppercase}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #4f2d10}
.btn.wide{display:flex;width:100%}
.btn.ghost{background:rgba(255,255,255,.02);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--brass)}
.btn.brick{background:linear-gradient(180deg,#c2402f,#7d1f18);color:#fbeee0;border-color:#e0604f55;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 #3d0e0a,0 6px 18px rgba(0,0,0,.4)}
.btn.sm{font-size:1rem;min-height:40px;padding:.35em .8em}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:10px}
.card,.panel{background:linear-gradient(180deg,rgba(38,32,28,.92),rgba(22,19,17,.94));border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.03)}
input[type=text],select{background:#0c0a09;border:1px solid var(--line);border-radius:6px;padding:.55em .7em;min-height:48px;min-width:0;color:var(--ink)}
input[type=text]{flex:1}
select{width:100%}
.home{max-width:580px;margin:0 auto;padding-top:5vh}
.tag{font-family:var(--flavor);font-style:italic;font-size:1.15rem;color:var(--muted);margin:-.2em 0 1.4em}
.choice{display:block;width:100%;text-align:left;background:linear-gradient(90deg,rgba(200,135,58,.13),rgba(255,255,255,.02));border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:14px 16px;min-height:48px}
.choice b{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.05em;display:block;color:var(--ink)}
.choice span{color:var(--muted);font-size:.92rem}
.choice:hover{border-color:var(--brass)}
.choice:disabled{opacity:.45}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:22px}
summary{font-family:var(--display);font-size:1.3rem;letter-spacing:.05em;cursor:pointer;min-height:44px;display:flex;align-items:center}
ol{padding-left:1.3em;margin:.4em 0}
li{margin-bottom:.5em}
.code{font-family:var(--display);font-size:clamp(3rem,13vw,5.5rem);letter-spacing:.18em;line-height:1;color:var(--brass2)}
.qr{width:170px;max-width:45vw;background:#f3ead8;padding:6px;border-radius:6px;flex:0 0 auto}.qr svg{display:block;width:100%;height:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:.45em .8em;min-height:44px;font-weight:600;font-size:.92rem}
.seg button[aria-pressed=true]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.field{margin-bottom:14px}
.field>label,.field>.lab{display:block;font-family:var(--display);letter-spacing:.06em;font-size:1.1rem;color:var(--muted);margin-bottom:4px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.x{border:0;background:transparent;font-size:1.3rem;min-width:44px;min-height:44px;color:var(--muted)}
.dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;vertical-align:baseline;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.top .brand{font-family:var(--display);font-size:1.7rem;letter-spacing:.08em;color:var(--brass2)}
.scores{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.sc{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;background:rgba(0,0,0,.35);font-size:.88rem;white-space:nowrap}
.sc.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 18px rgba(200,135,58,.25)}
.sc .pts{font-family:var(--display);font-size:1.15rem;letter-spacing:.04em;color:var(--brass2)}
.game{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.game.act .mapcol{order:-1}
@media (min-width:900px){.game{grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);align-items:start}.game .mapcol{order:-1}}
.mapcol{min-width:0}
.mis{margin-top:10px;background:linear-gradient(180deg,rgba(38,32,28,.92),rgba(22,19,17,.94));border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:10px;padding:10px 14px}
.mis h3{margin-bottom:.3em}
.mis .mrow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.mis .mrow:last-of-type{border-bottom:0}
.mis .ok{color:var(--ok)}
.wheels{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.wcard{text-align:center;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:10px}
.wheel{display:block;width:100%;max-width:150px;margin:6px auto;height:auto;overflow:visible}
.wheel.bigw{max-width:280px}
.wheel .rot{transform-origin:100px 100px;transform:rotate(var(--to,0deg));animation:wspin 3.4s cubic-bezier(.12,.75,.18,1) both}
@keyframes wspin{from{transform:rotate(0deg)}to{transform:rotate(var(--to,0deg))}}
.prize{font-family:var(--display);font-size:1.4rem;letter-spacing:.05em;color:var(--brass2);animation:fadein .4s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.wheel .rot,.prize{animation:none}}
.mapwrap{background:radial-gradient(ellipse at 50% 40%,#211b17,#100d0b);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.7)}
.mapwrap.mini{max-width:440px;margin-top:6px}
.mapsvg{display:block;width:100%;height:auto}
.nd{fill:#2b241f;stroke:#c8873a;stroke-width:3}
.nd.goal{stroke:#f1d3a0;stroke-width:7}
.nl{font-family:var(--display);letter-spacing:.06em;font-size:25px;fill:#e9dcc6;paint-order:stroke;stroke:#100d0b;stroke-width:7px;stroke-linejoin:round}
.seg0{stroke:#4a3f37;stroke-width:12}
.segb{stroke:#000;stroke-width:18}
.segc{stroke-width:12}
.hit{stroke:transparent;fill:none;cursor:pointer}
.rt.sel .seg0{stroke:#e2a85e}
.rt.sel .segb{stroke:#f1d3a0}
.msg{font-family:var(--flavor);font-style:italic;color:var(--brass2);margin-bottom:10px;font-size:1.02rem}
.slip{background:linear-gradient(180deg,#1f1a16,#151210);border:1px solid var(--line);border-top:3px solid var(--brass);padding:16px;border-radius:8px}
.slip .cat{font-family:var(--display);font-size:1.1rem;letter-spacing:.08em;color:var(--brass2)}
.slip .qt{font-size:1.3rem;font-weight:700;line-height:1.3;margin:.35em 0 .7em}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#0f0d0c;border:1px solid var(--line);border-radius:8px;padding:.65em .85em;min-height:54px;margin-top:8px;font-size:1.05rem;color:var(--ink)}
.opt i{font-family:var(--display);font-style:normal;font-size:1.3rem;width:1.3em;flex:0 0 auto;color:var(--brass2)}
button.opt:not(:disabled):hover{border-color:var(--brass)}
.opt.right{border-color:var(--ok);box-shadow:inset 6px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 6px 0 0 var(--bad);text-decoration:line-through}
.opt.mytip{border-color:var(--teal);box-shadow:inset 6px 0 0 var(--teal)}
.opt.dim{opacity:.45}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.fuse{height:5px;background:#2a231e;border-radius:3px;overflow:hidden;margin:12px 0 4px}
.fuse i{display:block;height:100%;background:linear-gradient(90deg,#e0604f,#e2a85e);width:100%;transform-origin:left;animation:fuse linear forwards}
@keyframes fuse{to{transform:scaleX(0)}}
.tipnote{margin-top:10px;padding:8px 12px;border-left:3px solid var(--teal);background:rgba(95,158,160,.08);font-size:.95rem;border-radius:0 6px 6px 0}
.cats{display:grid;gap:8px}
.catb{text-align:left;background:#0f0d0c;border:1px solid var(--line);border-radius:8px;padding:.6em 1em;min-height:54px;font-family:var(--display);font-size:1.45rem;letter-spacing:.05em;color:var(--ink)}
button.catb:hover{border-color:var(--brass)}
.pt{display:inline-block;border-radius:50%;overflow:hidden;vertical-align:middle;flex:0 0 auto;border:2px solid #c8873a;background:#000;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.pt svg{display:block;width:100%;height:100%}
.who{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.who h2{margin:0}
.chars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 0}
.charb{border:1px solid var(--line);background:#0f0d0c;border-radius:8px;padding:6px 2px;font-size:.7rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;min-width:0;color:var(--ink)}
.charb span:last-child{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.charb .pt{width:100%!important;max-width:60px;aspect-ratio:1/1;height:auto!important}
.charb[aria-pressed=true]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.charb:disabled{opacity:.25}
.ability{font-size:.9rem;color:var(--muted);min-height:1.4em}
.prog{display:flex;gap:6px;margin:4px 0 8px;align-items:center}
.prog i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.prog i.ok{background:var(--ok);border-color:var(--ok)}
.prog i.no{background:var(--bad);border-color:var(--bad)}
.vs{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:8px 0;text-align:center}
.vs b{display:block}
.res{font-family:var(--display);font-size:1.6rem;letter-spacing:.05em;margin:.2em 0;color:var(--brass2)}
.req{font-size:.86rem;color:var(--muted)}
.tok{display:inline-block;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.tok svg{display:block;width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:48px}
.chips .x1{position:relative}
.chips .x1::after{content:"";position:absolute;inset:-2px;background:linear-gradient(45deg,transparent 46%,#e0604f 46%,#e0604f 54%,transparent 54%)}
.bags{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.bagc{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:12px}
.bagc.bust{border-color:var(--bad)}
.bagc.ok{border-color:var(--ok)}
.bagc h3{display:flex;align-items:center;gap:8px;color:var(--ink)}
.inv{display:flex;flex-wrap:wrap;gap:8px}
.invi{display:flex;align-items:center;gap:6px;background:#0f0d0c;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:.88rem}
.shop{display:grid;gap:8px}
.shopi{display:flex;align-items:center;gap:10px;background:#0f0d0c;border:1px solid var(--line);border-radius:8px;padding:8px}
.shopi div{flex:1;min-width:0}
.shopi b{display:block}
.dice{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.diec{text-align:center;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:10px}
.diec .dd{display:flex;gap:6px;justify-content:center;margin:8px 0}
.die{width:46px;height:46px}
.die.roll{animation:roll .5s ease-out}
@keyframes roll{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.ansgrid{display:grid;gap:6px}
.ansrow{display:flex;align-items:center;gap:6px}
.ansrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ansrow button{min-width:44px;min-height:44px;border-radius:6px;border:1px solid var(--line);background:#0f0d0c;font-family:var(--display);font-size:1.2rem}
.ansrow button[aria-pressed=true]{background:var(--brass);color:var(--brass-ink)}
.teamstat{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.teamstat span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem}
.teamstat span.done{border-color:var(--ok);color:var(--ok)}
.teamstat span.ok{background:rgba(125,187,114,.15);border-color:var(--ok)}
.teamstat span.no{background:rgba(224,96,79,.12);border-color:var(--bad)}
.cd{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:rgba(10,8,7,.92);animation:flash .5s steps(1) 6}
.cd .who{justify-content:center}
.cd .lbl{font-family:var(--display);letter-spacing:.12em;font-size:clamp(1.4rem,5vw,2.6rem);color:var(--brass2)}
.cd .nums{position:relative;height:clamp(140px,40vw,320px);width:100%}
.cd .nums span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(140px,40vw,320px);line-height:1;color:var(--ink);opacity:0;animation:cdn 1s ease-out forwards;text-shadow:0 0 40px rgba(226,168,94,.6)}
@keyframes cdn{0%{opacity:1;transform:scale(1.5)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes flash{0%{background:rgba(10,8,7,.92)}50%{background:rgba(120,62,20,.85)}}
.pad{display:grid;place-items:center;width:100%;min-height:220px;border-radius:12px;border:1px solid var(--line);background:#0f0d0c;font-family:var(--display);font-size:2.6rem;letter-spacing:.08em;user-select:none;-webkit-user-select:none;color:var(--ink)}
.pad.go{background:linear-gradient(180deg,#dd9c50,#a8662a);color:var(--brass-ink)}
.digits{font-family:var(--display);font-size:3.4rem;letter-spacing:.2em;text-align:center;min-height:1.2em;color:var(--brass2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:10px auto 0}
.keys button{min-height:56px;font-family:var(--display);font-size:1.6rem;background:#0f0d0c;border:1px solid var(--line);border-radius:8px}
.notes{position:relative;width:100%;aspect-ratio:4/3;background:#0f0d0c;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.notes .tok{position:absolute}
.oddg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:380px;margin:0 auto}
.oddg button{aspect-ratio:1;border:0;background:transparent;padding:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:7px 5px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--display);font-weight:400;letter-spacing:.06em;font-size:1rem;color:var(--muted)}
.tw{overflow-x:auto}
.win{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.8rem);letter-spacing:.05em;margin:.3em 0;color:var(--brass2)}
.log{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-size:.85rem;color:var(--muted)}
.log div{padding:2px 0}
.log b{font-family:var(--display);font-weight:400;letter-spacing:.06em;color:var(--brass2);font-size:1rem}
.botb{font-family:var(--display);font-size:.85rem;letter-spacing:.08em;background:#2c4446;color:#cfe6e6;border-radius:4px;padding:1px 6px;margin-left:4px}
body.big .log{font-size:1rem}
.banner{background:var(--brick);color:#fbeee0;padding:8px 12px;border-radius:6px;margin-bottom:10px}
.foot{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.joincode{font-family:var(--display);font-size:1.7rem;letter-spacing:.12em;color:var(--brass2)}
body.big{font-size:21px}
body.big #app{max-width:none;padding:22px 34px 34px}
body.big h2{font-size:2.6rem}
body.big .slip .qt{font-size:2.3rem}
body.big .opt{font-size:1.45rem;min-height:68px}
body.big .qr{width:300px;max-width:30vw}
body.big .who .pt{width:110px!important;height:110px!important}
body.big .vs .pt{width:120px!important;height:120px!important}
body.big .die{width:70px;height:70px}
@media (min-width:900px){body.big .game{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){body::before,.fuse i,.die.roll{animation:none}.cd{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ---------- hjelpere ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

    const cum=[0];for(let k=1;k<P.length;k++)cum.push(cum[k-1]+Math.hypot(P[k][0]-P[k-1][0],P[k][1]-P[k-1][1]));return {P,cum,L:cum[cum.length-1]}});

  if(role==='guest'){sendAct(t,p);ui.pending=true;const k=++pendTok;setTimeout(()=>{if(k===pendTok&&ui.pending){ui.pending=false;render()}},4000);render()}
  else{apply({t,p:p||{}},CID);commit()}
}
const qDur=()=>{const b=S.cfg.level==='easy'?40:30;if(S.phase==='duel'){const d=S.duel;return (PL(d.a)&&PL(d.d)&&PL(d.a).owner===PL(d.d).owner)?b*2:b}if(S.phase==='lq'&&S.mode!=='net')return b+5*S.teams.length;return b};
function hostTimer(){
  if(!isHost()||ui.timerPn===S.pn)return;ui.timerPn=S.pn;clearTimeout(timer);const pn=S.pn,slack=role==='host'?1500:0;let ms=0,t=null;
  const ph=S.phase;
  if(ph==='count'){ms=3200;t='countDone'}
  else if(ph==='q'||ph==='duel'||ph==='lq'){ms=qDur()*1000+slack;t='timeout'}
  else if(ph==='lqres'){ms=3500;t='lqNext'}
  else if(ph==='lbuy'){ms=120000+slack;t='timeout'}
  else if(ph==='dice'&&S.dice.done){ms=3500;t='diceGo'}
  else if(ph==='wheel'&&S.wheel.done){ms=4800;t='wheelGo'}
  else if(ph==='bag'&&S.bagAll){ms=4000;t='bagGo'}
  if(t)timer=setTimeout(()=>{if(S&&S.pn===pn&&isHost()){apply({t,p:{pn}},CID);commit()}},ms*(window.__sotSpeed||1));
}
function onState(){
  setMap(S.cfg.map);
  if(S.pn!==ui.pn){ui.pn=S.pn;ui.pnAt=Date.now();ui.cat=null;ui.sel=null;ui.menu=false;ui.shady=false;ui.shop=false;ui.gun=false;if(role==='local')ui.showM=false;if(S.phase!=='mg')ui.mg=null}
  hostTimer();render();botTick();
}

function mapSVG(mt,ctxTeam,canAct,stt){
  const own=S.own&&S.own.length===EDGES.length?S.own:EDGES.map(()=>0);
  const goals={};if(mt&&misOpen())mt.missions.forEach(m=>{if(!mDone(mt,m)){goals[m.a]=1;goals[m.b]=1}});
  let s='<svg viewBox="0 0 840 790" class="mapsvg" role="img" aria-label="Kart over '+MAPINFO[MAPID].name+'"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern></defs><rect width="840" height="790" fill="url(#grid)"/>'+MAPINFO[MAPID].deco;
  EDGES.forEach((e,i)=>{const g=GEO[i],len=e[2],pad=24,gap=7,tot=g.L-2*pad,sl=(tot-gap*(len-1))/len,ow=own[i],col=ow&&T(ow)?T(ow).color:null;
    let clickable=false;
    if(canAct&&ctxTeam&&!(PAIR[i]>=0&&own[PAIR[i]]===ctxTeam.id)){if(!ow)clickable=!stt.bought;else if(ow!==ctxTeam.id)clickable=(!LYN()&&!stt.shady&&!stt.bought)||ctxTeam.inv.dyn>0}
    s+='<g class="rt'+(ui.sel===i?' sel':'')+'"'+(clickable?' data-a="sel" data-e="'+i+'"':'')+'>';
    for(let k=0;k<len;k++){const a=pad+k*(sl+gap),b=a+sl;const pts='points="'+polySub(g,a,b)+'"';
      s+=col?'<polyline class="segb" fill="none" '+pts+'/><polyline class="segc" fill="none" stroke="'+col+'" '+pts+'/>':'<polyline class="seg0" fill="none" '+pts+'/>'}
    if(clickable)s+='<polyline class="hit" style="stroke-width:'+(PAIR[i]>=0?20:38)+'px" points="'+polySub(g,0,g.L)+'"/>';
    s+='</g>'});
  NODES.forEach((n,i)=>{const lp=n[3]||0,lx=lp===2?n[1]-24:lp===3?n[1]+24:n[1],ly=lp===1?n[2]-26:lp>=2?n[2]+8:n[2]+44,an=lp===2?'end':lp===3?'start':'middle';
    s+='<circle class="nd'+(goals[i]?' goal':'')+'" cx="'+n[1]+'" cy="'+n[2]+'" r="15"/><circle cx="'+n[1]+'" cy="'+n[2]+'" r="5" fill="#c8873a"/><text class="nl" text-anchor="'+an+'" x="'+lx+'" y="'+ly+'">'+n[0]+'</text>'});
  return s+'</svg>';
}

  let s='<h2>Minispill: '+info.name+'</h2>';
  if(ui.mg&&ui.mg.pn!==S.pn)ui.mg=null;
  if(!ui.mg&&pend.length)ui.mg={pid:pend[0].id,pn:S.pn,st:'ready',n:0,entry:'',r:0,pen:0};
  const m=ui.mg;
  if(!m){
    s+='<p>'+info.desc+'</p><p class="muted">Venter på resten.</p>'+S.players.map(p=>'<div class="prow">'+portrait(p.ch,34)+'<span class="nm">'+esc(p.name)+'</span><span>'+(g.sc[p.id]!=null?info.fmt(g.sc[p.id]):'spiller …')+'</span></div>').join('');
    if(isHost())s+='<button class="btn ghost sm" style="margin-top:12px" data-a="mgSkip">Gå videre uten resten</button>';
    return s;
  }
  const p=PL(m.pid);
  if(m.st==='ready')return s+'<p>'+info.desc+'</p>'+whoHTML(p.id,', gjør deg klar')+'<button class="btn wide" data-a="mgStart">Jeg er klar</button>';
  const nm='<p><b>'+esc(p.name)+'</b></p>';
  if(g.type==='react')return s+nm+'<button class="pad'+(m.st==='go'?' go':'')+'" data-pd="mgTap">'+(m.st==='go'?'Nå!':'Vent …')+'</button>';
  if(g.type==='taps')return s+nm+'<button class="pad go" data-pd="mgTap"><span id="tapn">'+m.n+'</span></button>';
  if(g.type==='clock')return s+nm+'<div class="digits" id="clk">0.00</div><button class="pad go" data-pd="mgTap">Stopp</button>';
  if(g.type==='odd'){const idx=g.odd[m.r];return s+nm+'<p class="small muted">Runde '+(m.r+1)+' av 3</p><div class="oddg">'+Array.from({length:25},(_,i)=>'<button data-pd="mgOdd" data-i="'+i+'" aria-label="Mynt '+(i+1)+'">'+token('fake',56,i===idx?0:1)+'</button>').join('')+'</div>'}
  if(g.type==='count'&&m.st==='show')return s+nm+'<div class="notes">'+g.pos.map(q=>'<span class="tok" style="left:'+q[0]+'%;top:'+q[1]+'%;width:18%;transform:rotate('+q[2]+'deg)">'+token('note',60).replace(/^<span class="tok"[^>]*>/,'').replace(/<\/span>$/,'')+'</span>').join('')+'</div>';
  if(g.type==='mem'&&m.st==='show')return s+'<p><b>'+esc(p.name)+'</b>, husk koden.</p><div class="digits">'+g.code+'</div>';
  const keys='<div class="keys">'+[1,2,3,4,5,6,7,8,9].map(k=>'<button data-pd="mgKey" data-k="'+k+'">'+k+'</button>').join('')+(g.type==='count'?'<button data-pd="mgKey" data-k="ok">OK</button>':'<span></span>')+'<button data-pd="mgKey" data-k="0">0</button><button data-pd="mgKey" data-k="x" aria-label="Slett">⌫</button></div>';
  return s+'<p><b>'+esc(p.name)+'</b>, '+(g.type==='count'?'hvor mange sedler?':'tast koden.')+'</p><div class="digits" id="entry">'+(m.entry||'·')+'</div>'+keys;
}
function mgSubmit(v){const m=ui.mg;if(!m)return;ui.mgSent[S.pn+m.pid]=1;ui.mg=null;act('mgScore',{pid:m.pid,v})}
function mgresHTML(){
  const g=S.mg,info=MG[g.type];
  return '<h2>'+info.name+': resultat</h2><div class="tw"><table><tr><th>Lag</th><th>Resultat</th><th>Premie</th></tr>'
   +g.res.map(r=>'<tr><td><span class="dot" style="background:'+T(r.id).color+'"></span> '+tname(T(r.id))+'</td><td>'+info.fmt(r.v)+'</td><td>'+(r.p+r.j?'+'+(r.p+r.j)+' kr':'')+(r.j?' <span class="small muted">(jockey)</span>':'')+'</td></tr>').join('')
   +'</table></div><button class="btn wide" style="margin-top:14px" data-a="mgNext" '+(ui.pending?'disabled':'')+'>Neste runde</button>';
}
function finalHTML(){
  const res=finalScores(),f=S.fin;const col=(n,v)=>f>=n?v:'';
  let s='<h2>Oppgjørets time</h2><div class="tw"><table><tr><th>Lag</th><th>Ruter</th><th>Oppdrag</th><th>Bonus</th><th>Sum</th><th>Kroner</th></tr>';
  const rows=f>=3?res:res.slice().sort((a,b)=>a.id-b.id);
  rows.forEach(r=>{const t=T(r.id);s+='<tr><td><span class="dot" style="background:'+t.color+'"></span> '+tname(t)+'</td><td>'+r.rp+'</td><td>'+col(1,r.mp)+'</td><td>'+col(2,r.bp)+'</td><td><b>'+col(3,r.tot)+'</b></td><td class="muted">'+col(3,r.coins)+'</td></tr>'});
  s+='</table></div>';
  if(f>=2){const b=res.filter(r=>r.bon.length);if(b.length)s+='<p class="small">'+b.map(r=>tname(T(r.id))+': '+r.bon.join(', ')).join('. ')+'.</p>'}
  if(f<3)s+='<button class="btn wide" style="margin-top:14px" data-a="finNext" '+(ui.pending?'disabled':'')+'>'+['Avslør oppdragene','Del ut bonusprisene','Kår vinneren'][f]+'</button><p class="small muted">Uløste oppdrag gir minuspoeng. Kroner teller bare ved uavgjort.</p>';
  else{const a=res[0],b=res[1];let w;
    if(b&&a.tot===b.tot&&a.coins===b.coins){const top=res.filter(r=>r.tot===a.tot&&r.coins===a.coins);w='Byen deles mellom '+top.map(r=>tname(T(r.id))).join(' og ')}
    else w=tname(T(a.id))+' styrer '+MAPINFO[MAPID].name+(b&&a.tot===b.tot?' <span class="small muted">(flest kroner avgjorde)</span>':'');
    s+='<div class="win">'+w+'</div>';
    s+=isHost()?'<button class="btn wide" data-a="again">Nytt spill med samme folk</button>':'<p class="muted">Verten kan starte et nytt spill.</p>'}
  return s;
}
function gameHTML(){
  const ph=S.phase,t=S.turn;
  const activeTeam=LYN()||['duel','duelres','dice','bag','wheel'].includes(ph)?0:(t.pid&&PL(t.pid)?PL(t.pid).team:0);
  const mt=missionTeam(),big=ui.big&&role==='host';
  let mapCtx=null,mapCan=false,mapSt=null;
  if(ph==='act'&&mine(t.pid)){mapCtx=turnTeam();mapCan=true;mapSt=t}
  if(ph==='lbuy')ensureLt();
  if(ph==='lbuy'&&ui.lt&&T(ui.lt)&&!S.lyn.tt[ui.lt].done){mapCtx=T(ui.lt);mapCan=true;mapSt=S.lyn.tt[ui.lt]}
  let s=banner()+'<div class="top"><span class="brand">'+MAPINFO[MAPID].name+'</span><span class="small muted">'+(ph==='final'?'Slutt':ph==='dice'?'Terningkast':ph==='wheel'?'Lykkehjul':'Runde '+S.round+' av '+S.rounds)+(LYN()?' · lyn':'')+(S.mode==='net'&&!big?' · kode '+esc(S.code):'')+'</span>'+(big?'<span class="joincode">KODE '+esc(S.code)+'</span>':'')+'</div>';
  s+='<div class="scores">'+S.teams.map(x=>{const solo=!S.cfg.teams?members(x.id)[0]:null;const showC=myTeams().includes(x)||role==='local';
    return '<div class="sc'+(x.id===activeTeam&&!['final','mg','mgres'].includes(ph)?' on':'')+'">'+(solo?portrait(solo.ch,26):'')+'<span class="dot" style="background:'+x.color+'"></span> '+tname(x)+' <span class="pts">'+routePts(x)+' p</span>'+' <span class="muted">'+x.coins+' kr</span>'+'</div>'}).join('')+'</div>';
  s+='<div class="game'+(mapCan?' act':'')+'"><div class="panel">';
  if(S.msg)s+='<div class="msg" role="status">'+esc(S.msg)+'</div>';
  s+=ph==='count'?(LYN()?'<h2>Lynrunde '+S.round+'</h2>':(S.turn.pid?whoHTML(S.turn.pid):'')):ph==='dice'?diceHTML():ph==='wheel'?wheelHTML():ph==='cat'?catHTML():(ph==='q'||ph==='qres')?qHTML():ph==='act'?actHTML():ph==='duel'?duelHTML():ph==='duelres'?duelresHTML()
    :(ph==='lq'||ph==='lqres')?lqHTML():ph==='lbuy'?lbuyHTML():ph==='bag'?bagHTML():ph==='mg'?mgHTML():ph==='mgres'?mgresHTML():finalHTML();
  if(S.log&&S.log.length&&!['final','dice','wheel'].includes(ph))s+='<div class="log" aria-label="Siste hendelser"><b>Siste hendelser</b>'+S.log.slice(big?-5:-3).reverse().map(x=>'<div>Runde '+x.r+': '+esc(x.m)+'</div>').join('')+'</div>';
  if(mt&&!['final','mg','dice','wheel'].includes(ph)){s+='<div class="foot"><button class="btn ghost sm" data-a="invT">Gjenstander</button></div>';if(ui.inv)s+='<div class="card" style="margin-top:10px"><h3>'+tname(mt)+' eier</h3>'+invHTML(mt)+'</div>'}
  s+='</div><div class="mapcol"><div class="mapwrap">'+mapSVG(mt,mapCtx,mapCan,mapSt)+'</div>'+(mt&&ph!=='final'?misBox(mt):'')+'</div></div>';
  s+='<div class="foot"><button class="btn ghost sm" data-a="menu">Meny</button>'+(big?'<button class="btn ghost sm" data-a="fs">Fullskjerm</button>':'');
  if(ui.menu){
    if(role==='host'&&!LYN()&&['cat','q','qres','act','duel','duelres'].includes(ph))s+='<button class="btn ghost sm" data-a="takeover">Styr denne turen herfra</button>';
    s+='<button class="btn ghost sm" data-a="quit">'+(role==='guest'?'Forlat spillet':'Avslutt spillet')+'</button>';
  }
  s+='</div>';
  if(ph==='count')s+=countHTML();
  return s;
}

/* ---------- hendelser ---------- */
let wl=null,wlBusy=false;
async function keepAwake(){if(!S||S.mode!=='net'||wl||wlBusy||!navigator.wakeLock||document.visibilityState!=='visible')return;wlBusy=true;
  try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){}wlBusy=false}
document.addEventListener('visibilitychange',keepAwake);
const UIA={
  newLocal(){stopNet();ui.big=false;S=newState('local');role='local';ui.err='';onState()},
  newHost(){if(NET_OK()){ui.err='';ui.big=false;LS.set('sot.big',false);hostCreate()}},
  newBig(){if(NET_OK()){ui.err='';ui.big=true;LS.set('sot.big',true);hostCreate()}},
  fs(){const el=document.documentElement;try{if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{})}catch(e){}},
  join(){const el=$('#code');joinGame(el?el.value:ui.codeDraft)},
  resumeLocal(){const sl=LS.get('sot.local');if(sl&&sl.v===VERSION){S=sl;S.host=CID;S.players.forEach(p=>p.owner=CID);role='local';ui.timerPn=-1;onState()}},
  resumeNet(){const sn=LS.get('sot.net');if(!sn)return;const sh=LS.get('sot.host');if(sn.role==='host'&&sh&&sh.code===sn.code&&sh.v===VERSION){S=sh;role='host';ui.big=!!LS.get('sot.big');hostOpen(sn.code,true)}else joinGame(sn.code)},
  quit(){if(role==='local'&&S.phase==='lobby')LS.del('sot.local');if(role!=='local')LS.del('sot.net');if(role==='host')LS.del('sot.host');stopNet();S=null;role=null;ui.big=false;ui.menu=false;ui.net='';ui.err='';ui.pn=-1;render()},
  cfg(d){act('cfg',{k:d('k'),v:d('v')})},
  pickChar(d){ui.char=+d('c');render()},
  setChar(d){act('setChar',{id:ui.chFor,ch:+d('c')})},
  chFor(d){ui.chFor=d('id');render()},
  chDone(){ui.chFor=null;render()},
  addP(){const el=$('#pname');const name=(el?el.value:'').trim();if(!name)return;const free=freeChars(null);const ch=ui.char!=null&&free.includes(ui.char)?ui.char:free[0];ui.draft='';ui.char=null;if(el)el.value='';act('addP',{name,ch})},
  delP(d){if(ui.chFor===d('id'))ui.chFor=null;act('delP',{id:d('id')})},
  start(){ui.chFor=null;act('start')},
  roll(d){act('roll',{tid:+d('t')})},spin(d){act('spin',{tid:+d('t')})},spinAll(){act('spinAll')},
  botLv(d){ui.botLv=+d('v');render()},addBot(){act('addBot',{lv:ui.botLv||3})},rollAll(){act('rollAll')},
  cat(d){act('pickCat',{cat:+d('c')})},
  ans(d){act('answer',{i:+d('i')})},
  tip(d){act('tip',{i:+d('i')})},
  half(){act('half')},swap(){act('swap')},
  lyHalf(d){act('half',{pid:d('p')})},
  lyAns(d){act('lyAns',{tid:+d('t'),i:+d('i')})},
  lqNext(){act('lqNext')},
  lyTab(d){ui.lt=+d('t');ui.sel=null;render()},
  lyDone(d){ui.sel=null;ui.shop=false;ui.shady=false;act('lyDone',{tid:+d('t')})},
  lyEnd(){act('lyEnd')},
  next(){act('next')},
  sel(d){ui.sel=+d('e');render()},
  buy(d){if(ui.sel!=null){const e=ui.sel;ui.sel=null;act('buy',{e,pid:d('p')})}},
  challenge(){if(ui.sel!=null){const e=ui.sel;ui.sel=null;act('challenge',{e})}},
  dynUse(d){if(ui.sel!=null){const e=ui.sel;ui.sel=null;act('dyn',{e,pid:d('p')})}},
  shopT(){ui.shop=!ui.shop;ui.shady=false;render()},
  shopBuy(d){act('shop',{item:d('item'),pid:d('p')})},
  shadyMenu(){ui.shady=!ui.shady;ui.shop=false;render()},
  duel(d){ui.shady=false;act('duel',{tid:+d('t')})},
  rob(d){ui.shady=false;const gun=ui.gun;ui.gun=false;act('rob',{tid:+d('t'),pid:d('p'),gun})},
  duelAns(d){act('duelAns',{pid:d('p'),i:+d('i')})},
  duelNext(){act('duelNext')},
  mission(d){act('mission',{pid:d('p')})},endTurn(){act('endTurn')},
  bagTab(d){ui.lt=+d('t');render()},
  bagDraw(d){act('bagDraw',{tid:+d('t')})},bagStop(d){act('bagStop',{tid:+d('t')})},bagCop(d){act('bagCop',{tid:+d('t')})},bagSkip(){act('bagSkip')},
  showM(){ui.showM=!ui.showM;render()},
  invT(){ui.inv=!ui.inv;render()},
  menu(){ui.menu=!ui.menu;render()},
  takeover(){ui.menu=false;act('takeover')},
  mgStart(){const m=ui.mg,g=S.mg;if(!m||m.st!=='ready')return;
    if(g.type==='react'){m.st='wait';render();setTimeout(()=>{if(ui.mg!==m||m.st!=='wait')return;m.st='go';m.t0=performance.now();render()},1500+rnd(2600))}
    else if(g.type==='taps'){m.st='run';m.n=0;render();setTimeout(()=>{if(ui.mg===m)mgSubmit(m.n)},5000)}
    else if(g.type==='clock'){m.st='run';m.t0=performance.now();render();const tick=()=>{if(ui.mg!==m||m.st!=='run')return;const el=$('#clk'),e=performance.now()-m.t0;if(el)el.textContent=e<2000?(e/1000).toFixed(2):'?.??';if(e>15000){mgSubmit(5000);return}requestAnimationFrame(tick)};requestAnimationFrame(tick)}
    else if(g.type==='odd'){m.st='run';m.r=0;m.pen=0;m.t0=performance.now();render()}
    else{m.st='show';render();setTimeout(()=>{if(ui.mg!==m)return;m.st='enter';render()},g.type==='count'?(S.cfg.level==='easy'?3500:2500):(S.cfg.level==='easy'?4000:3000))}},
  mgSkip(){act('mgSkip')},mgNext(){act('mgNext')},finNext(){act('finNext')},again(){act('again')}
};
const PD={
  mgTap(){const m=ui.mg,g=S&&S.mg;if(!m||!g)return;
    if(g.type==='react'){if(m.st==='wait')mgSubmit(1500);else if(m.st==='go')mgSubmit(Math.min(1500,Math.round(performance.now()-m.t0)))}
    else if(g.type==='taps'&&m.st==='run'){m.n++;const el=$('#tapn');if(el)el.textContent=m.n}
    else if(g.type==='clock'&&m.st==='run'){m.st='done';mgSubmit(Math.min(5000,Math.round(Math.abs(performance.now()-m.t0-5000))))}},
  mgOdd(el){const m=ui.mg,g=S&&S.mg;if(!m||m.st!=='run'||g.type!=='odd')return;const i=+el.getAttribute('data-i');
    if(i===g.odd[m.r]){m.r++;if(m.r>=3){mgSubmit(Math.min(30000,Math.round(performance.now()-m.t0+m.pen)));return}render()}else{m.pen+=2000;el.style.opacity='.2'}},
  mgKey(el){const m=ui.mg,g=S&&S.mg;if(!m||m.st!=='enter')return;const k=el.getAttribute('data-k');
    if(k==='x')m.entry=m.entry.slice(0,-1);
    else if(k==='ok'){if(g.type==='count'&&m.entry){mgSubmit(Math.min(99,Math.abs(+m.entry-g.cnt)))}return}
    else if(g.type==='count'){if(m.entry.length<2)m.entry+=k}
    else m.entry+=k;
    if(g.type==='mem'&&m.entry.length>=g.code.length){let v=0;for(let i=0;i<g.code.length;i++)if(m.entry[i]===g.code[i])v++;mgSubmit(v);return}
    const e=$('#entry');if(e)e.textContent=m.entry||'·'}
};
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(!el||el.disabled)return;const f=UIA[el.getAttribute('data-a')];if(f)f(n=>el.getAttribute('data-'+n),el)});
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('[data-pd]');if(!el)return;e.preventDefault();const f=PD[el.getAttribute('data-pd')];if(f)f(el)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='pname')ui.draft=el.value;if(el.id==='code')ui.codeDraft=el.value});
document.addEventListener('change',e=>{const el=e.target,k=el.getAttribute&&el.getAttribute('data-ch');if(!k||!S)return;
  if(k==='team')act('setTeam',{id:el.getAttribute('data-id'),team:+el.value});
  if(k==='rounds')act('cfg',{k:'rounds',v:+el.value});
  if(k==='gun')ui.gun=el.checked});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target&&e.target.id;if(id==='pname'){e.preventDefault();UIA.addP()}if(id==='code'){e.preventDefault();UIA.join()}});

/* ---------- oppstart ---------- */
(function(){const h=(location.hash||'').slice(1).toUpperCase();
  if(/^[A-Z]{4}$/.test(h)){ui.codeDraft=h;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(NET_OK()){joinGame(h);return}}
  render()})();
window.__sot={get S(){return S},ui,UIA,PD,H,act,finalScores,get EDGES(){return EDGES},get PAIR(){return PAIR}};
})();
</script>
